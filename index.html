<!DOCTYPE html>
<html lang="en-US">
<!-- 3 Variables, 2 different data types (str, num, bool), 2 functions, shape moving automatically-->
  <head>
    <title>Untitled</title>
    <style>
      #ball {
        display: flex;
        border-radius: 0;
        background-color: maroon;
        position: absolute;
        width: 50px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div id="ball">
      
    </div>
    
    <script>
      stretchElement(document.getElementById("ball"));
      
      function stretchElement(element) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        if (document.getElementById("ball")) {
          document.getElementById("ball").onmousedown = dragMouseDown;
        }
        else {
          element.onmousedown = dragMouseDown;
        }
        
        function dragMouseDown(e) {
          e = e || window.event;
          e.preventDefault();
          
          pos3 = e.clientX;
          pos4 = e.clientY;
          
          document.onmouseup = closeDragElement;
          document.onmousemove = elementDrag;
        }
        
        function elementDrag(e) {
          e = e || window.event;
          e.preventDefault();
          
          pos1 = pos3 - e.clientX;
          pos2 = pos4 - e.clientY;
          pos3 = e.clientX;
          pos4 = e.clientY;
          
          element.style.width = (pos3 - element.style.left) + "px";
          element.style.height = (pos4 - element.style.top) + "px";
          element.style.backgroundColor = "blue";
          
        }
        
        function closeDragElement() {
          element.style.height = (50) + "px";
          element.style.width = (50) + "px";
          element.style.backgroundColor = "maroon";
          document.onmouseup = null;
          document.onmousemove = null;
        }
      }
    </script>
  </body>
</html>
